name: aftermath-maker

services:
  control:
    build:
      context: .
    image: puc/aftermath-maker:internal
    command: ["npm", "run", "start", "-w", "@puc/control"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTROL_HOST: 0.0.0.0
      CONTROL_PORT: 8787
      DATABASE_PATH: /data/maker.db
    volumes:
      - maker-data:/data
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:8787/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))",
        ]
      interval: 15s
      timeout: 5s
      retries: 8
      start_period: 20s
    networks:
      - maker-internal

  web:
    image: puc/aftermath-maker:internal
    command: ["npm", "run", "start", "-w", "@puc/web"]
    restart: unless-stopped
    env_file:
      - .env
    environment:
      CONTROL_URL: http://control:8787
      WEB_PORT: 8788
    ports:
      - "${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8788}:8788"
    depends_on:
      control:
        condition: service_healthy
    networks:
      - maker-internal

volumes:
  maker-data:

networks:
  maker-internal:
    driver: bridge
