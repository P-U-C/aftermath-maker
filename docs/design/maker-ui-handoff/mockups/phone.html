<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Maker phone</title>
<link rel="stylesheet" href="maker2.css">
<script src="mark.js"></script>
<style>
  body { height: 844px; overflow: hidden; position: relative; }
  .sb { height: 50px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 30px 6px; font-size: 16px; font-weight: 620; }
  .bat { display: inline-block; width: 25px; height: 12px; border: 1.5px solid var(--ink); border-radius: 4px; position: relative; top: -2px; opacity: .85; }
  .bat i { position: absolute; left: 1.5px; top: 1.5px; bottom: 1.5px; width: 15px; border-radius: 2px; background: var(--ink); }
  .bar { display: flex; justify-content: space-between; align-items: center; padding: 10px 18px 2px; }
  .bar .t { display: flex; align-items: center; gap: 10px; }
  .bar h1 { margin: 0; font-size: 32px; font-weight: 660; font-stretch: 122%; letter-spacing: -0.035em; }
  .wrap { padding: 12px 14px 140px; }
  .pc { background: var(--surface); border-radius: 18px; padding: 16px; margin-bottom: 12px; }
  .k { font-size: 13px; color: var(--ink-2); }
  .pnl { font-size: 44px; font-weight: 640; font-stretch: 125%; letter-spacing: -0.035em; margin: 4px 0 8px; }
  .two { display: flex; gap: 20px; font-size: 14px; color: var(--ink-2); }
  .two b { color: var(--ink); font-weight: 620; margin-left: 5px; }
  .mini { display: flex; justify-content: space-between; align-items: center; }
  .mini h2 { margin: 0; font-size: 17px; font-weight: 640; font-stretch: 112%; }
  .pc svg { width: 100%; display: block; margin-top: 10px; }
  .m { margin-top: 14px; }
  .m .row { display: flex; justify-content: space-between; font-size: 14px; margin-bottom: 7px; }
  .m .row span:last-child { color: var(--ink-2); }
  .dock { position: absolute; left: 0; right: 0; bottom: 0; padding: 12px 14px 34px; background: var(--material); backdrop-filter: saturate(170%) blur(22px); border-top: 1px solid var(--hair); display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .dock .btn { height: 52px; border-radius: 16px; font-size: 17px; }
  .home { position: absolute; bottom: 8px; left: 50%; width: 134px; height: 5px; margin-left: -67px; border-radius: 3px; background: var(--ink); opacity: .85; }
</style>
</head>
<body>
<script>applyTheme();</script>
<div class="rail" style="position:absolute"></div>
<div class="sb"><span>5:07</span><span class="bat"><i></i></span></div>
<div class="bar"><div class="t"><span class="mark" id="mark"></span><h1>Desk</h1></div><span class="pill live"><span class="dot"></span>Live</span></div>
<div class="wrap">
  <div class="pc">
    <div class="k">Today, all venues</div>
    <div class="pnl loss">−$0.01</div>
    <div class="two"><span>Equity<b>$14.94</b></span><span>Exposure<b>$1.04</b></span></div>
  </div>
  <div class="pc">
    <div class="mini"><h2>MON-PERP</h2><span class="venue"><i>A</i>Aftermath</span></div>
    <svg viewBox="0 0 330 76" role="img" aria-label="Your MON-PERP bid and ask against the market">
      <rect x="8" y="34" width="80" height="7" rx="3.5" fill="var(--tide-soft)"/>
      <rect x="242" y="34" width="80" height="7" rx="3.5" fill="var(--ember-soft)"/>
      <rect x="88" y="36.5" width="154" height="2" rx="1" fill="var(--fill-2)"/>
      <line x1="165" x2="165" y1="26" y2="50" stroke="var(--ink-3)" stroke-dasharray="2 3"/>
      <line x1="88" x2="88" y1="29" y2="46" stroke="var(--ink-3)" stroke-width="1.5"/>
      <line x1="242" x2="242" y1="29" y2="46" stroke="var(--ink-3)" stroke-width="1.5"/>
      <rect x="34" y="31" width="36" height="13" rx="6.5" fill="var(--tide)"/>
      <rect x="258" y="31" width="36" height="13" rx="6.5" fill="var(--ember)"/>
      <text x="52" y="16" text-anchor="middle" font-size="12.5" font-weight="620" fill="var(--tide-text)" font-family="Mona">0.021393</text>
      <text x="276" y="16" text-anchor="middle" font-size="12.5" font-weight="620" fill="var(--ember-text)" font-family="Mona">0.021484</text>
      <text x="165" y="16" text-anchor="middle" font-size="11.5" fill="var(--ink-2)" font-family="Mona">Index 0.021441</text>
      <text x="165" y="70" text-anchor="middle" font-size="12.5" font-weight="620" fill="var(--ink)" font-family="Mona">Spread 42 bps</text>
    </svg>
  </div>
  <div class="pc">
    <div class="mini"><h2>Risk</h2><span class="k">1 near a limit</span></div>
    <div class="m"><div class="row"><span>Gross exposure</span><span>$1.04 of $3.00</span></div><div class="track"><i style="width:35%"></i></div></div>
    <div class="m"><div class="row"><span>Worst-case inventory</span><span>$2.08 of $2.50</span></div><div class="track"><i class="warn" style="width:83%"></i></div></div>
    <div class="m"><div class="row"><span>Run drawdown</span><span>$0.01 of $1.00</span></div><div class="track"><i style="width:1.5%"></i></div></div>
  </div>
  <div class="pc" style="padding:2px 16px">
    <div class="lr" style="grid-template-columns:1fr auto;padding:0;height:48px"><span class="sym">MON<small>PERP</small></span><span class="gain">+$1.04</span></div>
    <div class="lr" style="grid-template-columns:1fr auto;padding:0;height:48px"><span class="sym">NEAR<small>PERP</small></span><span class="i2">$0.00</span></div>
  </div>
</div>
<div class="dock"><button class="btn quiet">Flatten…</button><button class="btn stop">Stop</button></div>
<div class="home"></div>
<script>document.getElementById("mark").innerHTML = markSVG("live", 18);</script>
</body>
</html>
