name: Maker dev gate

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: maker-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  maker-dev-gate:
    name: maker-dev-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CI: true
      LIVE_TRADING_ENABLED: "false"
      ALLOW_MAINNET: "false"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22.22.0
          cache: npm
      - run: npm ci
      - name: Verify fixture guardrails
        run: |
          test "$LIVE_TRADING_ENABLED" = false
          test "$ALLOW_MAINNET" = false
      - name: Validate dev release script
        run: bash -n deploy/maker-dev-deploy.sh
      - name: Fast format, lint, types, tests, and build
        run: |
          npm run format:check
          npm run lint
          npm run typecheck
          npm test
          npm run build
